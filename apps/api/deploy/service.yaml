# Cloud Run service definition, applied by the deploy workflow with
# `gcloud run services replace`.
#
# __IMAGE__ is a marker, not a value. The workflow replaces it with the digest of
# the image it just built, in a temporary copy of this file; nothing writes the
# digest back to the repository. The digest that is running is recorded in the
# workflow run and in the Cloud Run revision.
#
# Only identifiers appear here. The two keys are read from Secret Manager at a
# pinned version (never `latest`), so rotating a key is a deployment: add a
# version in Secret Manager, change the number below, merge.
#
# Replacing the service does not change its IAM policy: the public-invoker
# binding made during the one-time setup stays.

apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: ai-finance-api
  labels:
    cloud.googleapis.com/location: southamerica-east1
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "2"
        # CPU is allocated only while a request is being handled.
        run.googleapis.com/cpu-throttling: "true"
    spec:
      serviceAccountName: ai-finance-run@gen-lang-client-0828405476.iam.gserviceaccount.com
      # The Gemini call has no timeout of its own, so the platform one is the
      # only limit. 60 seconds is well above the usual latency of a
      # classification. Known limit: if Cloud Run cuts a request at this
      # point, the handler may still finish and insert its row after the 504,
      # and a retry by the user can then create a duplicate.
      timeoutSeconds: 60
      containers:
        - image: __IMAGE__
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          env:
            # PORT is set by Cloud Run and read by src/main.ts.
            - name: NODE_ENV
              value: production
            - name: AI_PROVIDER
              value: gemini
            # The exact model, never a "-latest" alias. The name is the one the
            # models endpoint lists for this project with generateContent. Google
            # retires versions, so check it again when a classification starts to
            # fall back with provider_error: a name that is not served makes every
            # classification a fallback.
            - name: GEMINI_MODEL
              value: gemini-3.8-flash
            # Origins that may call the API from a browser: exact origins, comma
            # separated. Without this variable no cross-origin request is allowed,
            # and the preview deployments of the web app are not listed.
            - name: CORS_ORIGINS
              value: https://nestjs-ai-provider-finance-web.vercel.app
            # Rate limiter, per client address and per instance (the counters live
            # in memory and start again with each instance). Starting values, to be
            # tuned after the measurement of the address that the service sees:
            # 120 requests per 60 seconds for the API (about one page load of the
            # web app every two seconds), 30 per 60 seconds for /v1/health, and
            # one proxy in front, so the client address is the last entry of
            # X-Forwarded-For. If a variable is missing the limiter is inactive.
            - name: RATE_LIMIT_WINDOW_SECONDS
              value: "60"
            - name: RATE_LIMIT_MAX
              value: "120"
            - name: RATE_LIMIT_HEALTH_MAX
              value: "30"
            - name: RATE_LIMIT_TRUSTED_PROXY_HOPS
              value: "1"
            - name: SUPABASE_URL
              value: https://qwgtwvimifwfuigcgmbv.supabase.co
            # Publishable key of Supabase, created for this service only.
            - name: SUPABASE_ANON_KEY
              valueFrom:
                secretKeyRef:
                  name: supabase-publishable-key-cloudrun
                  key: "1"
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: gemini-api-key-cloudrun
                  key: "2"
