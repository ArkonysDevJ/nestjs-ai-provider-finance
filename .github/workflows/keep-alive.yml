# .github/workflows/keep-alive.yml
# Pings GET /v1/health on the deployed backend every 2 days, as a backup to the
# external uptime monitor. /v1/health calls the database function public.ping(),
# so each request is real activity on the free-tier Supabase project, which
# pauses itself after about 7 days without activity.
#
# `0 9 */2 * *` fires on every 2nd day of the month at 09:00 UTC (04:00
# America/Lima), not on a strict 48-hour clock. At a month boundary the gap can
# shrink, never grow beyond 2 days. GitHub also does not guarantee that scheduled
# workflows fire exactly on time; at this frequency that does not matter.
#
# workflow_dispatch lets this be triggered manually from the Actions tab.
#
# This workflow only reads: it makes no commits and pushes nothing. Known limit:
# GitHub disables scheduled workflows in a public repository after 60 days
# without repository activity, and this workflow cannot prevent that without
# pushing to `main`, which only accepts changes through pull requests. Once that
# happens it stops silently. The external uptime monitor that requests the same
# URL is the primary mechanism and keeps the database active regardless.

name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 9 */2 * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        # Cloud Run scales to zero, so the first request after a quiet period
        # waits for an instance to start: allow 30 seconds and retry.
        run: curl --fail --show-error --silent --max-time 30 --retry 2 --retry-delay 5 --retry-all-errors "https://ai-finance-api-834290807468.southamerica-east1.run.app/v1/health"
