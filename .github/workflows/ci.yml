# Builds the API and the web app, builds the container image, and reports the
# state of the production dependencies. Nothing here touches the deployed demo
# or its database. There is no test step yet: the repository has no unit tests
# and the database tests do not run from a clean checkout.
#
# The job named `ci` builds and checks the code. The job named `guard` checks who
# wrote the commits, what the commit messages, the pull request text and the
# versioned files contain, and runs a secret scanner. Both are checks that branch
# protection on `main` requires, so a red run blocks the merge. The deploy
# workflow waits for this workflow (named `CI`) to finish on the same commit, so
# a failing `guard` also stops a deployment.

name: CI

on:
  push:
    branches: [main]
  # `edited` makes the guard run again when the title or the body of a pull
  # request changes after the first check.
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build API
        run: npm run build:api

      - name: Build web
        run: npm run build:web

      # The deploy workflow builds this same Dockerfile, so it must keep
      # building. Here the image is only built, not pushed or run.
      - name: Build the container image
        run: docker build -t ai-finance-api:ci .

      # Informational: this step always ends with status 0. It becomes a
      # blocking step once the dependency advisories are resolved.
      - name: Dependency audit (informational)
        run: |
          npm audit --omit=dev || echo "::warning::npm audit reported advisories (informational, not blocking)."

  guard:
    name: guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    env:
      # The identity every commit of a pull request must carry (a public alias).
      EXPECTED_NAME: ArkonysDevJ
      EXPECTED_EMAIL: 73614503+ArkonysDevJ@users.noreply.github.com
      EVENT_NAME: ${{ github.event_name }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      # Untrusted text: it reaches the script only as environment variables.
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_BODY: ${{ github.event.pull_request.body }}
      # The closed list lives in a repository secret and is never versioned. When
      # the secret is missing or empty the guard fails. Pull requests from forks
      # cannot read it and therefore fail the check; that is accepted.
      CLOSED_LIST: ${{ secrets.CLOSED_LIST }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      # Tests the guard itself with a synthetic list. It never reads the real list.
      - name: Guard self-test
        run: python3 -I .github/scripts/guard.py --self-test

      - name: Identity, attribution, closed list and identifier patterns
        run: python3 -I .github/scripts/guard.py

      # Runs in redacted mode: findings never print the secret that matched. The
      # scanner version is pinned; the artifact upload, the summary and the pull
      # request comments are off.
      - name: Secret scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "false"
          GITLEAKS_ENABLE_COMMENTS: "false"
