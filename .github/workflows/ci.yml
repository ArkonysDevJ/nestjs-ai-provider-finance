# Checks the code from a clean checkout: lint, format, build, unit tests, the
# database tests (pgTAP) and the HTTP tests (Bruno) against a local database
# stack, and the container image. It also reports the state of the production
# dependencies. Nothing here touches the deployed demo, its database or any
# external service: the API runs with the local provider against a fake
# classifier on loopback, so no key and no network call to Google are needed.
#
# The job named `ci` builds and checks the code. The job named `guard` checks who
# wrote the commits, what the commit messages, the pull request text and the
# versioned files contain, and runs a secret scanner. Both are checks that branch
# protection on `main` requires, so a red run blocks the merge. The deploy
# workflow waits for this workflow (named `CI`) to finish on the same commit, so
# a failing `guard` also stops a deployment.

name: CI

on:
  push:
    branches: [main]
  # `edited` makes the guard run again when the title or the body of a pull
  # request changes after the first check.
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Build API
        run: npm run build:api

      - name: Build web
        run: npm run build:web

      - name: Unit tests
        run: npm test

      - name: Acceptance criteria coverage
        run: node scripts/check-ac-coverage.mjs

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: 2.101.0

      # Only the services the project uses; the others would only slow the job.
      - name: Start local Supabase
        run: supabase start --exclude studio,imgproxy,mailpit,edge-runtime,logflare,vector,realtime,storage-api,postgres-meta

      - name: Database tests
        run: supabase test db

      # The URL and the publishable key of the local stack are local-only
      # values. They are masked and passed to the later steps.
      - name: Read the local stack settings
        run: |
          set -euo pipefail
          eval "$(supabase status -o env | grep -E '^(API_URL|ANON_KEY)=')"
          echo "::add-mask::${ANON_KEY}"
          echo "SUPABASE_URL=${API_URL}" >> "$GITHUB_ENV"
          echo "SUPABASE_ANON_KEY=${ANON_KEY}" >> "$GITHUB_ENV"

      - name: Create the local test users
        run: bash bruno/setup-local.sh users

      # The API runs with the local provider against a fake classifier on
      # loopback. It never calls Google and needs no key.
      - name: Start the fake classifier and the API
        run: |
          set -euo pipefail
          nohup node apps/api/test/support/fake-mcp-server.cjs > "${RUNNER_TEMP}/fake-mcp.log" 2>&1 &
          NODE_ENV=test AI_PROVIDER=local LOCAL_AI_ENDPOINT=http://127.0.0.1:8765/mcp PORT=3000 \
            nohup node apps/api/dist/main.js > "${RUNNER_TEMP}/api.log" 2>&1 &
          curl --fail --silent --show-error --retry 30 --retry-delay 2 --retry-connrefused \
            http://127.0.0.1:3000/v1/health

      - name: Create the local test fixtures
        run: bash bruno/setup-local.sh fixtures >> "$GITHUB_ENV"

      # The CLI is installed outside the repository, with install scripts
      # disabled, and run from the collection folder.
      - name: Install Bruno CLI
        run: npm install --prefix "${RUNNER_TEMP}/bru" --ignore-scripts --no-audit --no-fund @usebruno/cli@4.3.0

      - name: Integration tests (Bruno)
        working-directory: bruno/nestjs-ai-provider-finance
        run: |
          set -euo pipefail
          node "${RUNNER_TEMP}/bru/node_modules/@usebruno/cli/bin/bru.js" run auth categories transactions security-tests \
            --env local-stack \
            --env-var "supabaseAnonKey=${SUPABASE_ANON_KEY}" \
            --env-var "select_transaction_id=${SELECT_TRANSACTION_ID}" \
            --env-var "manual_category_id=${MANUAL_CATEGORY_ID}"

      - name: API log
        if: failure()
        run: cat "${RUNNER_TEMP}/api.log" || true

      # If the privilege checks through PostgREST ever take the database down,
      # the server log is the evidence to report.
      - name: Database log
        if: failure()
        run: |
          for c in $(docker ps -a --filter 'name=supabase_db_' --format '{{.Names}}'); do
            echo "== ${c}"; docker logs --tail 200 "${c}" 2>&1 || true
          done

      # The deploy workflow builds this same Dockerfile, so it must keep
      # building. Here the image is only built, not pushed or run.
      - name: Build the container image
        run: docker build -t ai-finance-api:ci .

      # Data steps of spec 003 on sample rows. It resets the local database, so it
      # runs after every step that needs the data, and it leaves the database in
      # the contract state for the next step.
      - name: Migration backfill check
        run: bash scripts/test-migration-backfill.sh

      # The contract stage is not in supabase/migrations: it is applied by the
      # step above, and these tests then check the state it leaves. The first file
      # installs pgTAP and the test helpers again after the reset.
      - name: Contract stage tests
        run: supabase test db supabase/tests/database/000-setup-tests-hooks.sql supabase/contract/tests

      # Informational: this step always ends with status 0. It becomes a
      # blocking step once the dependency advisories are resolved.
      - name: Dependency audit (informational)
        run: |
          npm audit --omit=dev || echo "::warning::npm audit reported advisories (informational, not blocking)."

  guard:
    name: guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    env:
      # The identity every commit of a pull request must carry (a public alias).
      EXPECTED_NAME: ArkonysDevJ
      EXPECTED_EMAIL: 73614503+ArkonysDevJ@users.noreply.github.com
      EVENT_NAME: ${{ github.event_name }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      # Untrusted text: it reaches the script only as environment variables.
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_BODY: ${{ github.event.pull_request.body }}
      # The closed list lives in a repository secret and is never versioned. When
      # the secret is missing or empty the guard fails. Pull requests from forks
      # cannot read it and therefore fail the check; that is accepted.
      CLOSED_LIST: ${{ secrets.CLOSED_LIST }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      # Tests the guard itself with a synthetic list. It never reads the real list.
      - name: Guard self-test
        run: python3 -I .github/scripts/guard.py --self-test

      - name: Identity, attribution, closed list and identifier patterns
        run: python3 -I .github/scripts/guard.py

      # Secret scanner. The release archive is checked against a fixed SHA-256
      # before it is unpacked, and the scanner runs in redacted mode: findings
      # never print the secret that matched. Nothing is uploaded.
      - name: Secret scan
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --max-time 120 \
            --output "${RUNNER_TEMP}/${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check --strict -
          mkdir "${RUNNER_TEMP}/gitleaks"
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}/gitleaks" gitleaks
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            range="${BASE_SHA}..${HEAD_SHA}"
          else
            range="-1"
          fi
          "${RUNNER_TEMP}/gitleaks/gitleaks" detect --source . --redact --no-banner --exit-code 2 --log-opts="${range}"
